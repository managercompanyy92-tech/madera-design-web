<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Madera AI</title>

  <!-- ГЛАВНОЕ: правильный путь к стилям -->
  <link rel="stylesheet" href="/src/styles/global.css">
  
  <script type="module" src="/src/main.js"></script>
</head>

    <header class="madera-header">
        <img src="/logo.png" alt="Madera" class="madera-logo" />
        <h1>AI-ассистент Madera</h1>
        <p>Помогу прикинуть стоимость и подобрать материалы</p>
    </header>

    <!-- Контейнер чата -->
    <div id="madera-chat" class="madera-chat">

        <div class="madera-chat__header">
            <h2>AI-ассистент Madera</h2>
            <button id="madera-chat-close" class="madera-chat__close">×</button>
        </div>

        <div id="madera-chat-messages" class="madera-chat__messages"></div>

        <div id="madera-chat-status" class="madera-chat__status">
            Готова помочь. Голосовые и текстовые запросы поддерживаются.
        </div>

        <form id="madera-chat-form" class="madera-chat__form">
            <input id="madera-chat-input" 
                   type="text" 
                   placeholder="Напишите или скажите ваш вопрос…" 
                   class="madera-chat__input" />

            <button id="madera-voice-btn" type="button" class="madera-chat__voice">🎤</button>
            <button type="submit" class="madera-chat__send">➤</button>
        </form>

    </div>

    <!-- Кнопка открытия чата -->
    <button id="madera-chat-open" class="madera-chat__open-btn">AI Помощник</button>

    <!-- Скрипт чата -->
    <script type="module" src="/chat.js"></script>

</body>
</html>
