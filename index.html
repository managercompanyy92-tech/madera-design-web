<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Madera Design — Современная корпусная мебель на заказ</title>

    <!-- Мобильная адаптивность -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <!-- SEO -->
    <meta
      name="description"
      content="Madera Design — корпусная мебель на заказ в Душанбе: кухни, шкафы, гардеробные, прихожие. Онлайн-калькулятор стоимости, дизайн и прозрачный статус заказа."
    />

    <!-- Глобальные стили -->
    <link rel="stylesheet" href="src/styles/global.css" />
  </head>

  <body>
    <!-- Корневой контейнер SPA -->
    <div id="app"></div>

    <!-- ====================== -->
    <!--     ЧАТ-АССИСТЕНТ      -->
    <!-- ====================== -->

    <!-- Кнопка чата (иконка девушки) -->
    <button class="ai-chat-button" id="aiChatToggle">
      <img
        src="assets/assistant.webp"
        alt="AI-ассистент"
        class="ai-chat-button__avatar"
      />
    </button>

    <!-- Панель чата -->
    <div class="ai-chat-panel" id="aiChatPanel">
      <div class="ai-chat-panel__header">
        <div class="ai-chat-panel__title">AI-ассистент Madera</div>
        <button class="ai-chat-panel__close" id="aiChatClose">×</button>
      </div>

      <div class="ai-chat-panel__hint">
        Задайте вопрос по стоимости, материалам или планировке —
        ассистент подскажет варианты.
      </div>

      <div class="ai-chat-panel__messages" id="aiChatMessages">
        <div class="ai-chat-msg ai-chat-msg--bot">
          <div class="ai-chat-msg__text">
            Здравствуйте! Я AI-ассистент Madera Design. Помогу рассчитать кухню
            или шкаф, подобрать материалы и подскажу по стилю.
          </div>
        </div>
      </div>

      <div class="ai-chat-panel__input-row">
        <input
          type="text"
          class="ai-chat-panel__input"
          id="aiChatInput"
          placeholder="Напишите ваш вопрос…"
        />
        <button class="ai-chat-panel__send" id="aiChatSend">➤</button>
      </div>

      <div class="ai-chat-panel__status">
        Онлайн-ассистент. Для точного расчёта потребуется менеджер и замер.
      </div>
    </div>

    <!-- Подключение SPA и чата -->
    <script type="module" src="src/main.js"></script>
    <script src="src/ai-chat.js"></script>
  </body>
</html>
