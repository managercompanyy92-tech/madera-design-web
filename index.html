<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Madera Design — Современная корпусная мебель</title>

    <!-- Мобильная вёрстка -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />

    <!-- SEO -->
    <meta
      name="description"
      content="Madera Design — корпусная мебель на заказ, онлайн-калькулятор стоимости, AI-ассистент, каталог идей."
    />

    <!-- Глобальные стили -->
    <link rel="stylesheet" href="src/styles/global.css" />
  </head>

  <body>
    <!-- Корневой контейнер SPA-приложения -->
    <div id="app"></div>

    <!-- ============================= -->
    <!--       КНОПКА ЧАТА (ИКОНКА)     -->
    <!-- ============================= -->
    <button id="ai-chat-toggle" class="ai-chat-toggle">
      <img
        src="src/assets/assistant.webp"
        alt="AI Assistant"
        class="ai-chat-avatar"
      />
    </button>

    <!-- ============================= -->
    <!--          ПАНЕЛЬ ЧАТА          -->
    <!-- ============================= -->

    <div class="madera-chat" id="madera-chat">
      <div class="madera-chat__header">
        <div>
          <div class="madera-chat__title">AI-ассистент Madera</div>
          <div class="madera-chat__subtitle">
            Помогу прикинуть стоимость и подобрать материалы
          </div>
        </div>
        <button type="button" class="madera-chat__close" id="ai-chat-close">
          ×
        </button>
      </div>

      <!-- Сообщения чата -->
      <div class="madera-chat__messages" id="madera-chat-messages">
        <div class="madera-chat__message madera-chat__message--bot">
          <div class="madera-chat__bubble">
            Здравствуйте! Я AI-ассистент Madera.  
            Помогу рассчитать стоимость кухни или шкафа и подсказать по материалам.
          </div>
        </div>
      </div>

      <!-- Поле ввода -->
      <form class="madera-chat__form" id="madera-chat-form">
        <input
          type="text"
          id="madera-chat-input"
          class="madera-chat__input"
          placeholder="Напишите ваш вопрос..."
          autocomplete="off"
        />
        <button type="submit" class="madera-chat__send">➤</button>
      </form>
    </div>

    <!-- ============================= -->
    <!--        JS-приложение          -->
    <!-- ============================= -->
    <script type="module" src="src/main.js"></script>
  </body>
</html>
